name: ps2gl
origin: port:ps2gl
tier: world
license: LGPL-2.1-only

# world: an OpenGL-1.x-shaped API over the GS/VU1, built on top of
# core/dma, core/kernel, core/graph and the ps2stuff package -
# vendored from https://github.com/ps2dev/ps2gl, built via its own
# real CMakeLists.txt (see cmake-toolchain/ps2dev.cmake and this
# repo's own .forgejo/workflows) rather than a hand-translated
# ps2build ps2.yaml, so this package.yaml is hand-authored to describe
# CMake's own install() output, not generated by "ps2build install".
#
# Two artifacts, not one: ps2glut (glut/) is a real second static
# library CMake builds and installs into this same package root
# (CMAKE_INSTALL_PREFIX is shared between ps2gl's own CMakeLists.txt
# and glut/CMakeLists.txt's add_subdirectory) - not every consumer
# needs it (BUILD_GLUT can be OFF), but this package.yaml describes
# what a real build with -DBUILD_GLUT=ON (this repo's own CI default)
# actually produces.
artifacts:
  - kind: library
    target: [ee]
    include_dirs: [include]
    headers: [dma, kernel, graph, ps2stuff]
    lib: lib/libps2gl.a

  - kind: library
    target: [ee]
    include_dirs: [include]
    headers: [ps2stuff]
    lib: lib/libps2glut.a
