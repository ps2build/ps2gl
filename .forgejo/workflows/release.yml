name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      # Two real actions/checkout quirks on this host - see build.yml's
      # own comment on this same step for the full story.
      - name: Checkout ps2stuff (build dependency)
        uses: actions/checkout@v4
        with:
          repository: ps2/ps2stuff
          ref: master
          path: ps2stuff

      - uses: https://git.techwritescode.dev/techwritescode/setup-forgejo@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup cmake
        uses: https://git.techwritescode.dev/techwritescode/setup-cmake@master

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: /opt/ps2dev
          components: toolchain,cmake,ninja,sdk-core

      # ps2build update installs ps2dev.cmake itself - see build.yml's
      # own comment on this same step.
      - name: Build + install ps2stuff
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S ps2stuff -B ps2stuff/build -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages/world/ps2stuff
          cmake --build ps2stuff/build
          cmake --install ps2stuff/build

      - name: Configure with CMake
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages/world/ps2gl \
            -DBUILD_GLUT=ON -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Install libraries
        run: cmake --install build

      # Real, unmodified upstream license text, not generated -
      # cmake --install only copies build outputs, never the repo's
      # own root COPYING - LGPL-2.1 has real distribution obligations,
      # so shipping this without its license text is a genuine
      # compliance problem, not a nicety.
      - name: Bundle license
        run: cp COPYING /opt/ps2dev/packages/world/ps2gl/COPYING

      # Unsuffixed, matching sdk-core/sdk-world/audsrv - this is
      # cross-compiled PS2 MIPS content, not a host binary.
      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          cd /opt/ps2dev/packages/world/ps2gl && zip -r "$GITHUB_WORKSPACE/ps2gl-$version.zip" .

      - name: Publish release
        run: |
          version="${GITHUB_REF_NAME}"
          fj release create "$version" -t "$version" -a "ps2gl-$version.zip" -r ps2/ps2gl
