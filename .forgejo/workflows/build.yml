name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      # ps2gl links against ps2stuff (ps2s/*.h, libps2stuff.a) - not yet
      # a released, ps2build-installable package in its own right (see
      # FEEDBACK.md's aftermarket-distribution notes), so it's built
      # from source here first and installed into the same
      # packages/world tree ps2dev.cmake already globs -I/-L from.
      # `path: ps2stuff` (not ../ps2stuff): actions/checkout's
      # path: ../x is rejected by this runner's own action sandboxing.
      # ref: master, not left to auto-detect - a real, separately
      # confirmed actions/checkout bug on this host: with no ref:
      # given, its own default-branch lookup fails for a cross-repo
      # checkout. Passing ref: explicitly skips that lookup entirely.
      - name: Checkout ps2stuff (build dependency)
        uses: actions/checkout@v4
        with:
          repository: ps2/ps2stuff
          ref: master
          path: ps2stuff

      - name: Setup cmake
        uses: https://git.techwritescode.dev/techwritescode/setup-cmake@master

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: /opt/ps2dev
          components: toolchain,cmake,ninja,sdk-core

      # Real bug found by actually watching this build run, not caught
      # locally: examples/CMakeLists.txt's tricked_out example calls
      # `dvp-as` unconditionally (not gated behind the VU1_TOOLS_AVAILABLE
      # check the main renderer loop uses, which falls back gracefully
      # to pre-built .vo objects when openvcl/masp aren't found) - it
      # fails outright if dvp-as isn't already on PATH. setup-sdk
      # installs the dvp toolchain but never adds it to PATH itself
      # (ps2build's own toolchain resolution never needs PATH) - this
      # workflow builds via raw CMake/ninja instead, which does rely on
      # PATH for a bare `COMMAND dvp-as`. Real path is
      # toolchain/dvp/bin, not dvp/bin - see ps2dev.cmake's own history
      # of getting this exact prefix wrong.
      - name: Add dvp/bin to PATH
        run: echo "/opt/ps2dev/toolchain/dvp/bin" >> "$GITHUB_PATH"

      # ps2build update installs ps2dev.cmake itself - both
      # CMakeLists.txt below already default CMAKE_TOOLCHAIN_FILE to
      # $ENV{PS2DEV}/cmake/ps2dev.cmake, so setting PS2DEV is all this
      # needs.
      - name: Build + install ps2stuff
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S ps2stuff -B ps2stuff/build -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages/world/ps2stuff
          cmake --build ps2stuff/build
          cmake --install ps2stuff/build

      # BUILD_EXAMPLES=OFF, matching release.yml: real bug found by
      # actually watching this build link, not guessed. Every VU1
      # renderer's microcode needs openvcl/masp (the VCL compiler) to
      # build - neither ships in the published toolchain release yet
      # (a real, separately known gap), and this repo has no pre-built
      # .vo fallback objects checked in either. The library itself
      # (libps2gl.a/libps2glut.a) builds fine either way - only linking
      # an actual example against a real renderer fails. Revisit once
      # openvcl/masp are real toolchain-release components.
      - name: Configure with CMake
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages/world/ps2gl \
            -DBUILD_GLUT=ON -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Install libraries
        run: cmake --install build

      - name: Get short SHA
        id: slug
        run: echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # The installed package directory (include/, lib/, package.yaml) -
      # same reasoning as ps2stuff's own build.yml: a real, complete
      # package someone could drop into $PS2DEV/packages/world/, not
      # just a bare .a.
      - uses: actions/upload-artifact@v3
        if: success()
        with:
          name: ps2gl-${{ steps.slug.outputs.sha8 }}
          path: /opt/ps2dev/packages/world/ps2gl
