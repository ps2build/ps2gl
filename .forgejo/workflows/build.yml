name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      # ps2gl links against ps2stuff (ps2s/*.h, libps2stuff.a) - not yet
      # a released, ps2build-installable package in its own right (see
      # FEEDBACK.md's aftermarket-distribution notes), so it's built
      # from source here first and installed into the same
      # packages/world tree ps2dev.cmake already globs -I/-L from,
      # exactly mirroring how the old GitHub Actions workflow cloned and
      # built ps2stuff as a build-time step before configuring ps2gl
      # itself. `path: ps2stuff` (not ../ps2stuff): actions/checkout's
      # path: ../x is rejected by this runner's own action sandboxing
      # ("Repository path ... is not under ... hostexecutor") - nesting
      # inside the checkout is fine here, since every reference to it
      # is fully contained within this workflow file (unlike
      # sdk-world's own sdk-core checkout, whose hardcoded ps2.yaml-
      # level ../../sdk-core paths need a true sibling).
      # ref: master, not left to auto-detect - a real, separately
      # confirmed actions/checkout bug on this runner: with no ref:
      # given, its own default-branch lookup fails ("The target
      # couldn't be found.") for any cross-repo checkout regardless of
      # path, even against a long-established repo (confirmed against
      # sdk-core in sdk-world's own CI). Passing ref: explicitly skips
      # that lookup entirely.
      - name: Checkout ps2stuff (build dependency)
        uses: actions/checkout@v4
        with:
          repository: ps2/ps2stuff
          ref: master
          path: ps2stuff

      - name: Clean C:\ps2dev-consumer
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\ps2dev-consumer -ErrorAction SilentlyContinue

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: C:\ps2dev-consumer

      # ps2build update installs ps2dev.cmake itself, into
      # C:\ps2dev-consumer\share\ - both CMakeLists.txt below already
      # default CMAKE_TOOLCHAIN_FILE to $ENV{PS2DEV}/share/ps2dev.cmake,
      # so setting PS2DEV is all this needs.
      - name: Build + install ps2stuff
        shell: pwsh
        run: |
          $env:PS2DEV = "C:\ps2dev-consumer"
          cmake -S ps2stuff -B ps2stuff\build -G Ninja `
            -DCMAKE_INSTALL_PREFIX=C:\ps2dev-consumer\packages\world\ps2stuff
          cmake --build ps2stuff\build
          cmake --install ps2stuff\build

      - name: Configure with CMake
        shell: pwsh
        run: |
          $env:PS2DEV = "C:\ps2dev-consumer"
          cmake -S . -B build -G Ninja `
            -DCMAKE_INSTALL_PREFIX=C:\ps2dev-consumer\packages\world\ps2gl `
            -DBUILD_GLUT=ON -DBUILD_EXAMPLES=ON

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Install libraries
        shell: pwsh
        run: cmake --install build

      - name: Get short SHA
        id: slug
        shell: pwsh
        run: "'sha8=' + $env:GITHUB_SHA.Substring(0,8) >> $env:GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v3
        if: success()
        with:
          name: ps2gl-examples-${{ steps.slug.outputs.sha8 }}
          path: |
            build/examples/*.elf
            build/examples/*.gl
            build/examples/*.rtx
            build/examples/*.bin
