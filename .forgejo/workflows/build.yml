name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      # sdk-dist isn't installed by setup-sdk - checked out purely as a
      # source for share/ps2dev.cmake, the CMake toolchain file this repo
      # (and ps2stuff below) build against.
      - name: Checkout sdk-dist (source, for share/ps2dev.cmake)
        uses: actions/checkout@v4
        with:
          repository: ps2/sdk-dist
          path: ../sdk-dist

      # ps2gl links against ps2stuff (ps2s/*.h, libps2stuff.a) - not yet
      # a released, ps2build-installable package in its own right (see
      # FEEDBACK.md's aftermarket-distribution notes), so it's built
      # from source here first and installed into the same
      # packages/world tree ps2dev.cmake already globs -I/-L from,
      # exactly mirroring how the old GitHub Actions workflow cloned and
      # built ps2stuff as a build-time step before configuring ps2gl
      # itself.
      - name: Checkout ps2stuff (build dependency)
        uses: actions/checkout@v4
        with:
          repository: ps2/ps2stuff
          path: ../ps2stuff

      - name: Clean C:\ps2dev-consumer
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\ps2dev-consumer -ErrorAction SilentlyContinue

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: C:\ps2dev-consumer

      - name: Build + install ps2stuff
        shell: pwsh
        run: |
          cmake -S ..\ps2stuff -B ..\ps2stuff\build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE=../sdk-dist/share/ps2dev.cmake `
            -DCMAKE_INSTALL_PREFIX=C:\ps2dev-consumer\packages\world\ps2stuff
          cmake --build ..\ps2stuff\build
          cmake --install ..\ps2stuff\build

      - name: Configure with CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE=../sdk-dist/share/ps2dev.cmake `
            -DCMAKE_INSTALL_PREFIX=C:\ps2dev-consumer\packages\world\ps2gl `
            -DBUILD_GLUT=ON -DBUILD_EXAMPLES=ON

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Install libraries
        shell: pwsh
        run: cmake --install build

      - name: Get short SHA
        id: slug
        shell: pwsh
        run: "'sha8=' + $env:GITHUB_SHA.Substring(0,8) >> $env:GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ps2gl-examples-${{ steps.slug.outputs.sha8 }}
          path: |
            build/examples/*.elf
            build/examples/*.gl
            build/examples/*.rtx
            build/examples/*.bin
